[package]
name = "cryptbench"
version = "26.0.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1"
scrypt = "0.11"
serde_yaml = "0.9"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
crossterm = "0.28"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
